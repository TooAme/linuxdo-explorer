login.helpMessage=使用说明：\n\n1. 在浏览器中正常访问 Linux.do 并完成登录\n2. 登录成功后，插件会自动从网络请求中获取 Cookie 和 User-Agent\n3. 看到“登录成功”提示后，点击“确定”按钮保存凭证\n\n提示：\n- 如果之前已经登录过，直接刷新页面即可\n- Cookie 中必须包含 \"_t=\" 字段才会被识别为有效登录\n- 凭证将安全存储在 IDE 的密码管理器中

